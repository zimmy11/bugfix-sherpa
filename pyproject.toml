[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfix-sherpa"
version = "0.1.0"
description = "Agente LangGraph per analisi e risoluzione di issue open source"
requires-python = ">=3.11"
dependencies = [
    # Core Agentico
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    # Interazione con GitHub e Sistema
    "PyGithub>=2.3.0",
    "GitPython>=3.1.40",
    # Utilities & Resilienza
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "ipython>=9.15.0",
    "langsmith>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]
